
services:
  nginx-http:
    image: nginx:latest
    ports:
      - "80:80"
    depends_on:
      - iam
      - mongo
      - keycloak
    volumes:
      # Main nginx config
      - ./apps/nginx/dev/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/www:/var/www/certbot

  nginx-https:
    image: nginx:latest
    container_name: nginx-https
    ports:
      - "443:443"
    depends_on:
      - nginx-http
    volumes:
      - ./nginx/https/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./volumes/letsencrypt:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot
      - ./apps/web/dist:/etc/nginx/html
      - ./apps/admin/dist:/etc/nginx/html/myadmin
    networks:
      - frontend
      - backend
  
  certbot:
    image: certbot/certbot:v1.4.0
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./volumes/letsencrypt:/etc/letsencrypt
    depends_on:
      - nginx-http
    entrypoint: "certbot certonly --non-interactive --agree-tos -m ${ADMIN_EMAIL} --webroot -w /var/www/certbot -d ${BASE_DOMAIN}"
    env_file:
      - ./apps/nginx/.env.dev

  iam:
    image: iam
    container_name: iam
    pull_policy: build
    build:
      context: .
      dockerfile: apps/iam/dockerfile.dev
    ports:
      - "5002:5002"
    env_file:
      - ./apps/iam/.env
      - ./apps/iam/.env.dev
    restart: unless-stopped
    volumes:
      - ./apps/iam:/app/apps/iam
      - /app/apps/iam/node_modules
    depends_on:
      mongo:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5002/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - backend
  
  postgres:
    image: postgres:18rc1
    pull_policy: always
    restart: no
    ports:
      - 5432:5432
    shm_size: 128m
    env_file :
      - ./apps/keycloak/.env
    volumes:
      - keycloak_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    networks:
      - backend

  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:26.4
    pull_policy: always
    restart: no
    ports:
      - 8080:8080
    env_file :
      - ./apps/keycloak/.env
      - ./apps/keycloak/.env.dev
    volumes:
      # Themes customizados
      - ./apps/keycloak/my-themes:/opt/keycloak/themes
      - ./apps/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    command: [
      "start-dev", 
      "--spi-theme-cache-themes=false",
      "--spi-theme-cache-templates=false",
      "--spi-theme-static-max-age=-1",
      "--http-port=8080", 
      "--hostname-debug=true",
      "--health-enabled=true",
      "--verbose",
      "--db=postgres",
      "--db-url=jdbc:postgresql://postgres:5432/$${DB_POSTGRES_SPACE}",
      "--db-password=$${DB_POSTGRES_PASSWORD}",
      "--db-username=$${DB_POSTGRES_USER}",
      "--import-realm",
    ]
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    networks:
      - frontend
      - backend

  mongo:
    image: mongo:8.0.14-noble
    pull_policy: always
    restart: no
    ports:
      - 27017:27017
    env_file:
      - ./apps/iam/.env.dev
    volumes:
      - mongodb:/data/db
    healthcheck:
      test: [ "CMD-SHELL", "mongosh --quiet --authenticationDatabase admin --username $${MONGO_INITDB_ROOT_USERNAME} --password $${MONGO_INITDB_ROOT_PASSWORD} localhost:27017/test --eval 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)'" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - backend

volumes:
  keycloak_postgres:
    name: call_center_dev_keycloak_postgres
  mongodb:
    name: call_center_dev_mongodb

networks:
  frontend:
  backend: