
services:
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      iam:
        condition: service_healthy
        restart: true
      realtime:
        condition: service_healthy
        restart: true
      mongo:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
      keycloak:
        condition: service_healthy
        restart: true
      web:
        condition: service_started
        restart: true
      admin:
        condition: service_started
        restart: true
    volumes:
      # Main nginx config
      - ./apps/nginx/dev/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./apps/nginx/dev/certs:/etc/nginx/certs:ro
      - ./apps/nginx/dev/certs:/etc/nginx/certs:ro
    networks:
      - frontend
      - backend

  iam:
    image: iam
    container_name: iam
    pull_policy: build
    build:
      context: .
      dockerfile: apps/iam/dockerfile.dev
    ports:
      - "5002:5002"
    env_file:
      - ./apps/iam/.env
      - ./apps/iam/.env.dev
    restart: unless-stopped
    volumes:
      - .:/app
    depends_on:
      mongo:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http = require('http'); http.get('http://127.0.0.1:5002/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - backend
  
  realtime:
    image: realtime
    container_name: realtime
    pull_policy: build
    build:
      context: .
      dockerfile: apps/realtime/dockerfile.dev
    ports:
      - "5003:5003"
    env_file:
      - ./apps/realtime/.env
      - ./apps/realtime/.env.dev
    restart: unless-stopped
    volumes:
      - .:/app
    depends_on:
      iam:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http = require('http'); const check = (url, cb) => http.get(url, r => cb(r.statusCode === 200)).on('error', () => cb(false)); check('http://127.0.0.1:5003/health', ok1 => { if (!ok1) process.exit(1); check('http://127.0.0.1:5003/webhooks/daily', ok2 => { if (!ok2) process.exit(1); check('http://127.0.0.1:5003/webhooks/iam', ok3 => process.exit(ok3 ? 0 : 1)); }); });\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - backend

  web:
    image: web
    container_name: web
    pull_policy: build
    build:
      context: .
      dockerfile: apps/web/dockerfile.dev
    ports:
      - "5173:5173"
    env_file:
      - ./apps/web/.env
      - ./apps/web/.env.development
    restart: unless-stopped
    volumes:
      - .:/app
    networks:
      - backend

  admin:
    image: admin
    container_name: admin
    pull_policy: build
    build:
      context: .
      dockerfile: apps/admin/dockerfile.dev
    ports:
      - "5174:5174"
    env_file:
      - ./apps/admin/.env.development
    restart: unless-stopped
    volumes:
      - .:/app
    networks:
      - backend

  postgres:
    image: postgres:18rc1
    pull_policy: always
    restart: no
    ports:
      - 5432:5432
    shm_size: 128m
    env_file :
      - ./apps/keycloak/.env
    volumes:
      - keycloak_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    networks:
      - backend

  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:26.4
    pull_policy: always
    restart: no
    ports:
      - 8080:8080
    env_file :
      - ./apps/keycloak/.env
      - ./apps/keycloak/.env.dev
    volumes:
      # Themes customizados
      - ./apps/keycloak/my-themes:/opt/keycloak/themes
      - ./apps/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    command: [
      "start-dev", 
      "--spi-theme-cache-themes=false",
      "--spi-theme-cache-templates=false",
      "--spi-theme-static-max-age=-1",
      "--http-port=8080", 
      "--hostname-debug=true",
      "--health-enabled=true",
      "--verbose",
      "--db=postgres",
      "--db-url=jdbc:postgresql://postgres:5432/$${DB_POSTGRES_SPACE}",
      "--db-password=$${DB_POSTGRES_PASSWORD}",
      "--db-username=$${DB_POSTGRES_USER}",
      "--import-realm",
    ]
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /auth/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && timeout 5 cat <&3 | grep -q '200'"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - frontend
      - backend

  mongo:
    container_name: mongo
    image: mongo:8.0.14-noble
    pull_policy: always
    restart: no
    ports:
      - 27017:27017
    env_file:
      - ./apps/iam/.env.dev
    volumes:
      - mongodb:/data/db
    healthcheck:
      test: [ "CMD-SHELL", "mongosh --quiet --authenticationDatabase admin --username $${MONGO_INITDB_ROOT_USERNAME} --password $${MONGO_INITDB_ROOT_PASSWORD} localhost:27017/test --eval 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)'" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - backend

  redis:
    image: redis:7-alpine
    pull_policy: always
    restart: no
    ports:
      - 6379:6379
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - backend

  loki:
    image: grafana/loki:3.6.12
    container_name: loki
    restart: no
    expose:
      - "3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - backend

  promtail:
    image: grafana/promtail:3.6.11
    container_name: promtail
    restart: no
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      loki:
        condition: service_started
    networks:
      - backend

  grafana:
    image: grafana/grafana:11.6.0
    container_name: grafana
    restart: no
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - frontend
      - backend

volumes:
  keycloak_postgres:
    name: call_center_dev_keycloak_postgres
  mongodb:
    name: call_center_dev_mongodb
  loki_data:
    name: call_center_dev_loki_data
  grafana_data:
    name: call_center_dev_grafana_data

networks:
  frontend:
  backend: