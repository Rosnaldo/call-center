
services:
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - iam
      - realtime
      - redis
      - mongo
      - keycloak
    volumes:
      # Main nginx config
      - ./apps/nginx/dev/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./apps/nginx/dev/certs:/etc/nginx/certs:ro
      - ./apps/nginx/dev/certs:/etc/nginx/certs:ro
      - ./apps/web/dist:/etc/nginx/html
      - ./apps/admin/dist:/etc/nginx/html/myadmin
    networks:
      - frontend
      - backend

  iam:
    image: iam
    container_name: iam
    pull_policy: build
    build:
      context: .
      dockerfile: apps/iam/dockerfile.dev
    ports:
      - "5002:5002"
    env_file:
      - ./apps/iam/.env
      - ./apps/iam/.env.dev
    restart: unless-stopped
    volumes:
      - ./apps/iam:/app/apps/iam
      - /app/apps/iam/node_modules
    depends_on:
      mongo:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http = require('http'); http.get('http://127.0.0.1:5002/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - backend
  
  realtime:
    image: realtime
    container_name: realtime
    pull_policy: build
    build:
      context: .
      dockerfile: apps/realtime/dockerfile.dev
    ports:
      - "5003:5003"
    env_file:
      - ./apps/realtime/.env
      - ./apps/realtime/.env.dev
    restart: unless-stopped
    volumes:
      - ./apps/realtime:/app/apps/realtime
      - /app/apps/realtime/node_modules
    depends_on:
      iam:
        condition: service_healthy
        restart: true
    networks:
      - backend

  postgres:
    image: postgres:18rc1
    pull_policy: always
    restart: no
    ports:
      - 5432:5432
    shm_size: 128m
    env_file :
      - ./apps/keycloak/.env
    volumes:
      - keycloak_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    networks:
      - backend

  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:26.4
    pull_policy: always
    restart: no
    ports:
      - 8080:8080
    env_file :
      - ./apps/keycloak/.env
      - ./apps/keycloak/.env.dev
    volumes:
      # Themes customizados
      - ./apps/keycloak/my-themes:/opt/keycloak/themes
      - ./apps/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    command: [
      "start-dev", 
      "--spi-theme-cache-themes=false",
      "--spi-theme-cache-templates=false",
      "--spi-theme-static-max-age=-1",
      "--http-port=8080", 
      "--hostname-debug=true",
      "--health-enabled=true",
      "--verbose",
      "--db=postgres",
      "--db-url=jdbc:postgresql://postgres:5432/$${DB_POSTGRES_SPACE}",
      "--db-password=$${DB_POSTGRES_PASSWORD}",
      "--db-username=$${DB_POSTGRES_USER}",
      "--import-realm",
    ]
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    networks:
      - frontend
      - backend

  mongo:
    container_name: mongo
    image: mongo:8.0.14-noble
    pull_policy: always
    restart: no
    ports:
      - 27017:27017
    env_file:
      - ./apps/iam/.env.dev
    volumes:
      - mongodb:/data/db
    healthcheck:
      test: [ "CMD-SHELL", "mongosh --quiet --authenticationDatabase admin --username $${MONGO_INITDB_ROOT_USERNAME} --password $${MONGO_INITDB_ROOT_PASSWORD} localhost:27017/test --eval 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)'" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - backend

  redis:
    image: redis:7-alpine
    pull_policy: always
    restart: no
    ports:
      - 6379:6379
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - backend

  loki:
    image: grafana/loki:3.5.0
    container_name: loki
    restart: no
    expose:
      - "3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend

  promtail:
    image: grafana/promtail:3.5.0
    container_name: promtail
    restart: no
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      loki:
        condition: service_healthy
        restart: true
    networks:
      - backend

  grafana:
    image: grafana/grafana:11.6.0
    container_name: grafana
    restart: no
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_healthy
        restart: true
    networks:
      - frontend
      - backend

volumes:
  keycloak_postgres:
    name: call_center_dev_keycloak_postgres
  mongodb:
    name: call_center_dev_mongodb
  loki_data:
    name: call_center_dev_loki_data
  grafana_data:
    name: call_center_dev_grafana_data

networks:
  frontend:
  backend: