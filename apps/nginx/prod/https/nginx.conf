
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    sendfile on;

    server {
        listen 443 ssl;
        server_name nanithefuck.com.br www.nanithefuck.com.br;

        ssl_certificate /etc/letsencrypt/live/nanithefuck.com.br/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/nanithefuck.com.br/privkey.pem;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # NGINX compresses responses before sending them to the client (browser)
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_proxied expired no-cache no-store private auth;
        gzip_types
            text/plain
            text/css
            text/xml
            text/javascript
            application/javascript
            application/xml+rss
            application/json;

        # Main SPA
        location / {
            proxy_pass https://d1bg1gulylxih6.cloudfront.net;  # CloudFront domain
            proxy_set_header Host d1bg1gulylxih6.cloudfront.net; # S3/CloudFront expects its host
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout 10s;
            proxy_read_timeout 30s;

            # Handle WebSockets or long-lived requests if needed
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Redirect /myadmin → /myadmin/
        location = /myadmin {
            return 301 /myadmin/;
        }

        # Admin SPA
        location /myadmin/ {
            proxy_pass https://d2noehnwpbne3f.cloudfront.net/;  # CloudFront domain
            proxy_set_header Host d2noehnwpbne3f.cloudfront.net; # S3/CloudFront expects its host
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout 10s;
            proxy_read_timeout 30s;

            # Handle WebSockets or long-lived requests if needed
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location /iam/ {
            client_max_body_size 10m;
            proxy_pass http://iam:5002/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SSE stream (see apps/realtime/src/routes/realtime_events.ts) — same
        # reasoning as /realtime/call-events/ below: needs its own block ahead
        # of the generic /realtime/ one (which sets Connection: upgrade for the
        # websocket) so nginx doesn't buffer this persistent connection.
        location /realtime/realtime-events/ {
            proxy_pass http://realtime:5003/realtime-events/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }

        # SSE stream (see apps/realtime/src/routes/call_events.ts) — IAM still
        # owns the call/incomingCall domain and publishes here over Redis, but
        # realtime is what serves the actual stream to the browser now, so
        # this lives under /realtime/ instead of /iam/. Needs its own block
        # ahead of the generic /realtime/ one below for the same reason as
        # /realtime/realtime-events/: nginx buffers proxied responses by
        # default, so a persistent stream's res.write() calls would sit in
        # nginx's buffer instead of reaching the browser's EventSource.
        location /realtime/call-events/ {
            proxy_pass http://realtime:5003/call-events/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }

        location /realtime/ {
            proxy_pass http://realtime:5003/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /auth/ {
            proxy_pass http://keycloak:8080/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
