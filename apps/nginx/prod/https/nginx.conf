
upstream callcenter_cdn {
    zone callcenter_cdn 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server ${CDN_HOST}:443 resolve;
}

upstream callcenter_cdn_admin {
    zone callcenter_cdn_admin 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server ${CDN_ADMIN_HOST}:443 resolve;
}

upstream callcenter_iam {
    zone callcenter_iam 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server callcenter-iam:5002 resolve;
}

upstream callcenter_realtime {
    zone callcenter_realtime 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server callcenter-realtime:5003 resolve;
}

upstream callcenter_keycloak {
    zone callcenter_keycloak 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server callcenter-keycloak:8080 resolve;
}

server {
    listen 443 ssl;
    server_name ${BASE_DOMAIN} www.${BASE_DOMAIN};

    ssl_certificate /etc/letsencrypt/live/${BASE_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${BASE_DOMAIN}/privkey.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # NGINX compresses responses before sending them to the client (browser)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;

    # Main SPA
    location / {
        proxy_pass https://callcenter_cdn;  # CloudFront domain
        proxy_set_header Host ${CDN_HOST}; # S3/CloudFront expects its host
        # The upstream is named `callcenter_cdn`, so send the real hostname as TLS SNI.
        proxy_ssl_server_name on;
        proxy_ssl_name ${CDN_HOST};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 30s;

        # Handle WebSockets or long-lived requests if needed
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Redirect /myadmin → /myadmin/
    location = /myadmin {
        return 301 /myadmin/;
    }

    # Admin SPA
    location /myadmin/ {
        # The prefix is stripped: the admin bucket holds index.html and assets/ at its
        # root, while the build (base /myadmin/) asks for /myadmin/assets/...
        proxy_pass https://callcenter_cdn_admin/;  # CloudFront domain
        proxy_set_header Host ${CDN_ADMIN_HOST}; # S3/CloudFront expects its host
        # The upstream is named `callcenter_cdn_admin`, so send the real hostname as TLS SNI.
        proxy_ssl_server_name on;
        proxy_ssl_name ${CDN_ADMIN_HOST};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 30s;

        # Handle WebSockets or long-lived requests if needed
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /iam/ {
        client_max_body_size 10m;
        proxy_pass http://callcenter_iam/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE stream (see apps/realtime/src/routes/realtime_events.ts) — same
    # reasoning as /realtime/call-events/ below: needs its own block ahead
    # of the generic /realtime/ one (which sets Connection: upgrade for the
    # websocket) so nginx doesn't buffer this persistent connection.
    location /realtime/realtime-events/ {
        proxy_pass http://callcenter_realtime/realtime-events/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Public SSE stream of the attendants online, for visitors who aren't
    # logged in (see apps/realtime/src/routes/public_attendants.ts). Same
    # unbuffered setup as /realtime/realtime-events/ above.
    location /realtime/public/ {
        proxy_pass http://callcenter_realtime/public/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # SSE stream (see apps/realtime/src/routes/call_events.ts) — IAM still
    # owns the call/incomingCall domain and publishes here over Redis, but
    # realtime is what serves the actual stream to the browser now, so
    # this lives under /realtime/ instead of /iam/. Needs its own block
    # ahead of the generic /realtime/ one below for the same reason as
    # /realtime/realtime-events/: nginx buffers proxied responses by
    # default, so a persistent stream's res.write() calls would sit in
    # nginx's buffer instead of reaching the browser's EventSource.
    location /realtime/call-events/ {
        proxy_pass http://callcenter_realtime/call-events/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location /realtime/ {
        proxy_pass http://callcenter_realtime/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /auth/ {
        proxy_pass http://callcenter_keycloak/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
