
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    sendfile on;

    server {
        listen 80;
        server_name free-porn-block.com www.free-porn-block.com;
        return 301 https://$host$request_uri;  # redireciona todo HTTP para HTTPS
    }

    server {
        listen 443 ssl;
        server_name free-porn-block.com www.free-porn-block.com;

        ssl_certificate /etc/nginx/certs/free-porn-block.com.pem;
        ssl_certificate_key /etc/nginx/certs/free-porn-block.com-key.pem;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # NGINX compresses responses before sending them to the client (browser)
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_proxied expired no-cache no-store private auth;
        gzip_types
            text/plain
            text/css
            text/xml
            text/javascript
            application/javascript
            application/xml+rss
            application/json;

        # Main SPA
        location / {
            root /etc/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        # Redirect /myadmin → /myadmin/
        location = /myadmin {
            return 301 /myadmin/;
        }

        # Admin SPA
        location /myadmin/ {
            alias /etc/nginx/html-admin/;
            try_files $uri $uri/ /myadmin/index.html;
        }

        location /iam/ {
            client_max_body_size 10m;
            proxy_pass http://iam:5002/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /realtime/ {
            proxy_pass http://realtime:5003/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /auth/ {
            proxy_pass http://keycloak:8080/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
