
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    sendfile on;

    server {
        listen 80;
        server_name free-porn-block.com www.free-porn-block.com;
        return 301 https://$host$request_uri;  # redireciona todo HTTP para HTTPS
    }

    server {
        listen 443 ssl;
        server_name free-porn-block.com www.free-porn-block.com;

        ssl_certificate /etc/nginx/certs/free-porn-block.com.pem;
        ssl_certificate_key /etc/nginx/certs/free-porn-block.com-key.pem;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # NGINX compresses responses before sending them to the client (browser)
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_proxied expired no-cache no-store private auth;
        gzip_types
            text/plain
            text/css
            text/xml
            text/javascript
            application/javascript
            application/xml+rss
            application/json;

        # Main SPA (Vite dev server — proxied, not served from dist/, so HMR works)
        location / {
            proxy_pass http://web:5173;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Redirect /myadmin → /myadmin/
        location = /myadmin {
            return 301 /myadmin/;
        }

        # Admin SPA (Vite dev server — proxied, not served from dist/, so HMR works).
        # No path after the upstream: nginx forwards the URI unchanged, keeping the
        # /myadmin/ prefix intact — Vite itself is configured with base: /myadmin/.
        location /myadmin/ {
            proxy_pass http://admin:5174;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # SSE stream (see apps/iam/src/routes/call_events.ts) — needs its own
        # block ahead of the generic /iam/ one below: nginx buffers proxied
        # responses by default, so a persistent stream's res.write() calls
        # would sit in nginx's buffer instead of reaching the browser's
        # EventSource. proxy_http_version/Connection avoid nginx falling back
        # to HTTP/1.0 keepalive-less proxying for a long-lived connection.
        location /iam/call-events/ {
            proxy_pass http://iam:5002/call-events/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }

        location /iam/ {
            client_max_body_size 10m;
            proxy_pass http://iam:5002/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SSE stream (see apps/realtime/src/routes/realtime_events.ts) — same
        # reasoning as /iam/call-events/ above: needs its own block ahead of
        # the generic /realtime/ one (which sets Connection: upgrade for the
        # websocket) so nginx doesn't buffer this persistent connection.
        location /realtime/realtime-events/ {
            proxy_pass http://realtime:5003/realtime-events/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }

        location /realtime/ {
            proxy_pass http://realtime:5003/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /auth/ {
            proxy_pass http://keycloak:8080/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
