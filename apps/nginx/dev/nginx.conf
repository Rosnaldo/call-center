
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    sendfile on;

    # Docker's embedded DNS. Paired with `resolve` on each upstream server so
    # nginx re-resolves the container names (and CloudFront) every `valid`
    # period instead of pinning the IP it saw at startup: a recreated container
    # gets a new IP, and nginx can start even if an upstream isn't up yet.
    # Requires nginx >= 1.27.3 and a `zone` in every upstream.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream web {
        zone web 64k;
        server web:5173 resolve;
    }

    upstream admin {
        zone admin 64k;
        server admin:5174 resolve;
    }

    upstream iam {
        zone iam 64k;
        server iam:5002 resolve;
    }

    upstream realtime {
        zone realtime 64k;
        server realtime:5003 resolve;
    }

    upstream keycloak {
        zone keycloak 64k;
        server keycloak:8080 resolve;
    }

    server {
        listen 80;
        server_name free-porn-block.com www.free-porn-block.com;
        return 301 https://$host$request_uri;  # redireciona todo HTTP para HTTPS
    }

    server {
        listen 443 ssl;
        server_name free-porn-block.com www.free-porn-block.com;

        ssl_certificate /etc/nginx/certs/free-porn-block.com.pem;
        ssl_certificate_key /etc/nginx/certs/free-porn-block.com-key.pem;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # NGINX compresses responses before sending them to the client (browser)
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_proxied expired no-cache no-store private auth;
        gzip_types
            text/plain
            text/css
            text/xml
            text/javascript
            application/javascript
            application/xml+rss
            application/json;

        # Main SPA (Vite dev server — proxied, not served from dist/, so HMR works)
        location / {
            proxy_pass http://web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Redirect /myadmin → /myadmin/
        location = /myadmin {
            return 301 /myadmin/;
        }

        # Admin SPA (Vite dev server — proxied, not served from dist/, so HMR works).
        # No path after the upstream: nginx forwards the URI unchanged, keeping the
        # /myadmin/ prefix intact — Vite itself is configured with base: /myadmin/.
        location /myadmin/ {
            proxy_pass http://admin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /iam/ {
            client_max_body_size 10m;
            proxy_pass http://iam/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SSE stream (see apps/realtime/src/routes/realtime_events.ts) — same
        # reasoning as /realtime/call-events/ below: needs its own block ahead
        # of the generic /realtime/ one (which sets Connection: upgrade for the
        # websocket) so nginx doesn't buffer this persistent connection.
        location /realtime/realtime-events/ {
            proxy_pass http://realtime/realtime-events/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }

        # Public SSE stream of the attendants online, for visitors who aren't
        # logged in (see apps/realtime/src/routes/public_attendants.ts). Same
        # unbuffered setup as /realtime/realtime-events/ above.
        location /realtime/public/ {
            proxy_pass http://realtime/public/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }

        # SSE stream (see apps/realtime/src/routes/call_events.ts) — IAM still
        # owns the call/incomingCall domain and publishes here over Redis, but
        # realtime is what serves the actual stream to the browser now, so
        # this lives under /realtime/ instead of /iam/. Needs its own block
        # ahead of the generic /realtime/ one below for the same reason as
        # /realtime/realtime-events/: nginx buffers proxied responses by
        # default, so a persistent stream's res.write() calls would sit in
        # nginx's buffer instead of reaching the browser's EventSource.
        location /realtime/call-events/ {
            proxy_pass http://realtime/call-events/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }

        location /realtime/ {
            proxy_pass http://realtime/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /auth/ {
            proxy_pass http://keycloak/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
