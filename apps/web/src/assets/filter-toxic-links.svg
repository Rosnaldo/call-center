    .icon { fill: none; stroke: #C49B55; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .icon-fill { fill: #C49B55; }
    .text-label { fill: #7A6C5D; font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; font-size: 14px; font-weight: 500; letter-spacing: 2px; text-anchor: middle; text-transform: uppercase; }
  </style>

  <path class="line" d="M 300 380 C 300 330, 600 320, 600 295" />
