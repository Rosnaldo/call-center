
services:
  # Port 80: Let's Encrypt's HTTP challenge (files written by certbot) and the
  # redirect to HTTPS.
  callcenter-nginx-http:
    image: nginx:1.27-alpine
    container_name: callcenter_nginx_http
    ports:
      - "80:80"
    restart: unless-stopped
    volumes:
      - ./apps/nginx/prod/http/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
    networks:
      - frontend

  # Port 443: TLS, then each route. Needs the certificate from `certbot`.
  # nginx.conf is a template: the image's entrypoint renders /etc/nginx/templates/
  # into conf.d with envsubst, limited by NGINX_ENVSUBST_FILTER to the variables of
  # apps/nginx/.env.prod so nginx's own $vars are left alone.
  callcenter-nginx-https:
    image: nginx:1.27-alpine
    container_name: callcenter_nginx_https
    ports:
      - "443:443"
    restart: unless-stopped
    env_file:
      - ./apps/nginx/.env.prod
    environment:
      NGINX_ENVSUBST_FILTER: "^(BASE_DOMAIN|CDN_HOST|CDN_ADMIN_HOST)$$"
    volumes:
      - ./apps/nginx/prod/https/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ./letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - callcenter-nginx-http
    # Reloads every 6h so renewed certificates (see certbot-renew) are picked up. The
    # image's entrypoint is called by hand: it is what renders the template.
    command: /bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & exec /docker-entrypoint.sh nginx -g "daemon off;"'
    networks:
      - frontend
      - backend

  # One-shot: obtains (or expands to include www) the certificate for BASE_DOMAIN,
  # stored under letsencrypt/live/<BASE_DOMAIN>/. Exits.
  callcenter-certbot:
    image: certbot/certbot:v2.11.0
    container_name: callcenter_certbot
    env_file:
      - ./apps/nginx/.env.prod
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./letsencrypt:/etc/letsencrypt
    depends_on:
      - callcenter-nginx-http
    entrypoint: /bin/sh -c 'certbot certonly --non-interactive --agree-tos --keep-until-expiring --expand -m $$ADMIN_EMAIL --webroot -w /var/www/certbot --cert-name $$BASE_DOMAIN -d $$BASE_DOMAIN -d www.$$BASE_DOMAIN'

  # Long-running: renews the certificate every 12h (certbot no-ops until it is within
  # 30 days of expiry); nginx-https reloads on its own 6h loop.
  callcenter-certbot-renew:
    image: certbot/certbot:v2.11.0
    container_name: callcenter_certbot_renew
    restart: unless-stopped
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./letsencrypt:/etc/letsencrypt
    depends_on:
      - callcenter-nginx-https
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done'

  callcenter-iam:
    image: callcenter_iam
    container_name: callcenter_iam
    pull_policy: build
    build:
      context: .
      dockerfile: apps/iam/dockerfile.prod
    expose:
      - "5002"
    env_file:
      - ./apps/iam/.env
      - ./apps/iam/.env.production
    restart: unless-stopped
    depends_on:
      callcenter-mongo:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http = require('http'); http.get('http://127.0.0.1:5002/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      frontend:
        aliases: [iam]
      backend:
        aliases: [iam]
  
  callcenter-realtime:
    image: callcenter_realtime
    container_name: callcenter_realtime
    pull_policy: build
    build:
      context: .
      dockerfile: apps/realtime/dockerfile.prod
    expose:
      - "5003"
    env_file:
      - ./apps/realtime/.env
      - ./apps/realtime/.env.production
    restart: unless-stopped
    depends_on:
      callcenter-iam:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http = require('http'); const check = (url, cb) => http.get(url, r => cb(r.statusCode === 200)).on('error', () => cb(false)); check('http://127.0.0.1:5003/health', ok1 => { if (!ok1) process.exit(1); check('http://127.0.0.1:5003/webhooks/daily', ok2 => { if (!ok2) process.exit(1); check('http://127.0.0.1:5003/webhooks/iam', ok3 => process.exit(ok3 ? 0 : 1)); }); });\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      backend:
        aliases: [realtime]

  callcenter-postgres:
    image: postgres:18rc1
    container_name: callcenter_postgress
    pull_policy: always
    restart: unless-stopped
    expose:
      - "5432"
    shm_size: 128m
    env_file :
      - ./apps/keycloak/.env
    volumes:
      - keycloak_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    networks:
      backend:
        aliases: [postgres]

  callcenter-keycloak:
    container_name: callcenter_keycloak
    image: quay.io/keycloak/keycloak:26.4
    pull_policy: always
    restart: unless-stopped
    expose:
      - "8080"
    env_file :
      - ./apps/keycloak/.env
      - ./apps/keycloak/.env.production
    volumes:
      # Themes customizados
      - ./apps/keycloak/my-themes:/opt/keycloak/themes
      - ./apps/keycloak/realm-export.prod.json:/opt/keycloak/data/import/realm-export.json
    command: [
      "start",
      "--spi-theme-cache-themes=false",
      "--spi-theme-cache-templates=false",
      "--spi-theme-static-max-age=-1",
      "--http-port=8080",
      "--http-enabled=true",
      "--hostname-strict=false",
      "--hostname-debug=true",
      "--health-enabled=true",
      "--verbose",
      "--db=postgres",
      "--db-url=jdbc:postgresql://postgres:5432/$${DB_POSTGRES_SPACE}",
      "--db-password=$${DB_POSTGRES_PASSWORD}",
      "--db-username=$${DB_POSTGRES_USER}",
      "--import-realm",
    ]
    depends_on:
      callcenter-postgres:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /auth/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && timeout 5 cat <&3 | grep -q '200'"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      frontend:
        aliases: [keycloak]
      backend:
        aliases: [keycloak]

  callcenter-mongo:
    container_name: callcenter_mongo
    image: mongo:8.0.14-noble
    pull_policy: always
    restart: unless-stopped
    ports:
      - 127.0.0.1:27017:27017
    env_file:
      - ./apps/iam/.env.production
    volumes:
      - mongodb:/data/db
    healthcheck:
      test: [ "CMD-SHELL", "mongosh --quiet --authenticationDatabase admin --username $${MONGO_INITDB_ROOT_USERNAME} --password $${MONGO_INITDB_ROOT_PASSWORD} localhost:27017/test --eval 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)'" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      backend:
        aliases: [mongo]

  callcenter-redis:
    image: redis:7-alpine
    container_name: callcenter_redis
    pull_policy: always
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      backend:
        aliases: [redis]

  callcenter-loki:
    image: grafana/loki:3.6.12
    container_name: callcenter_loki
    restart: unless-stopped
    expose:
      - "3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      backend:
        aliases: [loki]

  callcenter-promtail:
    image: grafana/promtail:3.6.11
    container_name: callcenter_promtail
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      callcenter-loki:
        condition: service_started
    networks:
      backend:
        aliases: [promtail]

  callcenter-grafana:
    image: grafana/grafana:11.6.0
    container_name: callcenter_grafana
    restart: unless-stopped
    ports:
      - 127.0.0.1:3000:3000
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    depends_on:
      callcenter-loki:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      frontend:
        aliases: [grafana]
      backend:
        aliases: [grafana]

volumes:
  keycloak_postgres:
    name: call_center_prod_keycloak_postgres
  mongodb:
    name: call_center_prod_mongodb
  loki_data:
    name: call_center_prod_loki_data
  grafana_data:
    name: call_center_prod_grafana_data
  redis_data:
    name: call_center_prod_redis_data

networks:
  frontend:
  backend:
