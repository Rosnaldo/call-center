# Production stack:  docker compose -f docker-compose.prod.yml up -d --build
#
# Nothing is published on 80/443: the server's central proxy (proxy-hostinger) owns
# them, gets the certificate and routes this domain with apps/nginx/prod/https/nginx.conf
# (filled from apps/nginx/.env.prod). It reaches callcenter-iam, callcenter-chatbot,
# callcenter-realtime and callcenter-keycloak over the external `edge` network,
# shared with the other apps on the server.
#
# Every service is prefixed with callcenter- so names never clash on `edge`. Inside
# this stack each one also keeps its short name (iam, redis, keycloak, ...) as an
# alias on frontend/backend only, which is what the .env files and monitoring/ use.
services:
  callcenter-iam:
    image: callcenter_iam
    container_name: callcenter_iam
    pull_policy: build
    build:
      context: .
      dockerfile: apps/iam/dockerfile.prod
    expose:
      - "5002"
    env_file:
      - ./apps/iam/.env
      - ./apps/iam/.env.production
    restart: unless-stopped
    depends_on:
      callcenter-mongo:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http = require('http'); http.get('http://127.0.0.1:5002/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      frontend:
        aliases: [iam]
      backend:
        aliases: [iam]
      edge:
  
  callcenter-chatbot:
    image: callcenter_chatbot
    container_name: callcenter_chatbot
    pull_policy: build
    build:
      context: .
      dockerfile: apps/chatbot/dockerfile.prod
    expose:
      - "5004"
    env_file:
      - ./apps/chatbot/.env
      - ./apps/chatbot/.env.production
    environment:
      - EXECUTABLE_URL=http://executable:5005
      - IAM_URI=http://iam:5002
    restart: unless-stopped
    depends_on:
      callcenter-executable:
        condition: service_healthy
        restart: true
    networks:
      frontend:
        aliases: [chatbot]
      backend:
        aliases: [chatbot]
      edge:

  # Creates the installers for the chatbot (apps/executable/src/server.ts).
  # Local LLM that reads the chatbot's free-text answers (apps/chatbot/src/extractor.ts).
  # The chatbot doesn't wait for it: until it's up, answers go through each
  # step's own parser.
  callcenter-ollama:
    image: ollama/ollama:0.34.4
    container_name: callcenter_ollama
    restart: unless-stopped
    environment:
      # Keeps the model loaded: loading it takes seconds on CPU.
      - OLLAMA_KEEP_ALIVE=-1
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      backend:
        aliases: [ollama]

  # Downloads the chatbot's model (OLLAMA_MODEL) into the ollama volume, then exits.
  callcenter-ollama-pull:
    image: ollama/ollama:0.34.4
    container_name: callcenter_ollama_pull
    restart: "no"
    env_file:
      - ./apps/chatbot/.env.production
    environment:
      - OLLAMA_HOST=ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull \"$$OLLAMA_MODEL\""]
    depends_on:
      callcenter-ollama:
        condition: service_healthy
    networks:
      - backend

  callcenter-executable:
    image: callcenter_executable
    container_name: callcenter_executable
    pull_policy: build
    build:
      context: .
      dockerfile: apps/executable/dockerfile.prod
      # Constant release signing key for the device owner APK, so rebuilds keep
      # the same signature and installed apps can be updated (pm install -r).
      # Sourced from the env (ANDROID_KEYSTORE_BASE64 is the keystore base64,
      # ANDROID_KEYSTORE_PASSWORD its password); never baked into the image.
      secrets:
        - android_keystore_b64
        - android_keystore_password
    expose:
      - "5005"
    env_file:
      - ./apps/executable/.env
      - ./apps/executable/.env.production
    environment:
      - EXECUTABLE_PORT=5005
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http = require('http'); http.get('http://127.0.0.1:5005/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      backend:
        aliases: [executable]

  callcenter-realtime:
    image: callcenter_realtime
    container_name: callcenter_realtime
    pull_policy: build
    build:
      context: .
      dockerfile: apps/realtime/dockerfile.prod
    expose:
      - "5003"
    env_file:
      - ./apps/realtime/.env
      - ./apps/realtime/.env.production
    restart: unless-stopped
    depends_on:
      callcenter-iam:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http = require('http'); const check = (url, cb) => http.get(url, r => cb(r.statusCode === 200)).on('error', () => cb(false)); check('http://127.0.0.1:5003/health', ok1 => { if (!ok1) process.exit(1); check('http://127.0.0.1:5003/webhooks/daily', ok2 => { if (!ok2) process.exit(1); check('http://127.0.0.1:5003/webhooks/iam', ok3 => process.exit(ok3 ? 0 : 1)); }); });\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      backend:
        aliases: [realtime]
      edge:

  callcenter-postgres:
    image: postgres:18rc1
    container_name: callcenter_postgress
    pull_policy: always
    restart: unless-stopped
    expose:
      - "5432"
    shm_size: 128m
    env_file :
      - ./apps/keycloak/.env
    volumes:
      - keycloak_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    networks:
      backend:
        aliases: [postgres]

  callcenter-keycloak:
    container_name: callcenter_keycloak
    image: quay.io/keycloak/keycloak:26.4
    pull_policy: always
    restart: unless-stopped
    expose:
      - "8080"
    env_file :
      - ./apps/keycloak/.env
      - ./apps/keycloak/.env.production
    volumes:
      # Themes customizados
      - ./apps/keycloak/my-themes:/opt/keycloak/themes
      - ./apps/keycloak/realm-export.prod.json:/opt/keycloak/data/import/realm-export.json
    command: [
      "start",
      "--spi-theme-cache-themes=false",
      "--spi-theme-cache-templates=false",
      "--spi-theme-static-max-age=-1",
      "--http-port=8080",
      "--http-enabled=true",
      "--hostname-strict=false",
      "--hostname-debug=true",
      "--health-enabled=true",
      "--verbose",
      "--db=postgres",
      "--db-url=jdbc:postgresql://postgres:5432/$${DB_POSTGRES_SPACE}",
      "--db-password=$${DB_POSTGRES_PASSWORD}",
      "--db-username=$${DB_POSTGRES_USER}",
      "--import-realm",
    ]
    depends_on:
      callcenter-postgres:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /auth/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && timeout 5 cat <&3 | grep -q '200'"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      frontend:
        aliases: [keycloak]
      backend:
        aliases: [keycloak]
      edge:

  callcenter-mongo:
    container_name: callcenter_mongo
    image: mongo:8.0.14-noble
    pull_policy: always
    restart: unless-stopped
    ports:
      - 127.0.0.1:27017:27017
    env_file:
      - ./apps/iam/.env.production
    volumes:
      - mongodb:/data/db
    healthcheck:
      test: [ "CMD-SHELL", "mongosh --quiet --authenticationDatabase admin --username $${MONGO_INITDB_ROOT_USERNAME} --password $${MONGO_INITDB_ROOT_PASSWORD} localhost:27017/test --eval 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)'" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      backend:
        aliases: [mongo]

  callcenter-redis:
    image: redis:7-alpine
    container_name: callcenter_redis
    pull_policy: always
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      backend:
        aliases: [redis]

  callcenter-loki:
    image: grafana/loki:3.6.12
    container_name: callcenter_loki
    restart: unless-stopped
    expose:
      - "3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      backend:
        aliases: [loki]

  callcenter-promtail:
    image: grafana/promtail:3.6.11
    container_name: callcenter_promtail
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      callcenter-loki:
        condition: service_started
    networks:
      backend:
        aliases: [promtail]

  callcenter-grafana:
    image: grafana/grafana:11.6.0
    container_name: callcenter_grafana
    restart: unless-stopped
    ports:
      - 127.0.0.1:3000:3000
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    depends_on:
      callcenter-loki:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      frontend:
        aliases: [grafana]
      backend:
        aliases: [grafana]

volumes:
  keycloak_postgres:
    name: call_center_prod_keycloak_postgres
  mongodb:
    name: call_center_prod_mongodb
  loki_data:
    name: call_center_prod_loki_data
  grafana_data:
    name: call_center_prod_grafana_data
  redis_data:
    name: call_center_prod_redis_data
  ollama_data:
    name: call_center_prod_ollama_data

networks:
  frontend:
  backend:
  # Shared with the central proxy; created once with `docker network create edge`.
  edge:
    external: true
# Release signing key for the device owner APK (apps/executable), sourced from
# the environment so it stays constant across rebuilds without living in git:
#   export ANDROID_KEYSTORE_BASE64="$(base64 -w0 lockdown-release.jks)"
#   export ANDROID_KEYSTORE_PASSWORD=...
secrets:
  android_keystore_b64:
    environment: ANDROID_KEYSTORE_BASE64
  android_keystore_password:
    environment: ANDROID_KEYSTORE_PASSWORD
